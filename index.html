<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Gestor Ferretería — Sistema de gestión para ferreterías</title>
<meta name="description" content="Ventas, presupuestos, cuentas corrientes y actualización de precios por lista de proveedor para ferreterías.">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1917;--steel:#2b3440;--steel2:#3b4756;--acc:#ea580c;--acc2:#fbbf24;--bg:#f4f3f1;--card:#fff;--line:#e5e2de;--mut:#6b7280;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef3c7;--info:#1d4ed8;--infobg:#dbeafe;--r:12px;--rs:8px;--sh:0 2px 10px rgba(28,25,23,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Barlow,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.4}
.hidden{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,.cond{font-family:'Barlow Condensed',Barlow,sans-serif;letter-spacing:.2px}
/* header */
header.top{background:var(--steel);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;height:58px;position:sticky;top:0;z-index:50;border-bottom:4px solid var(--acc)}
.brand{display:flex;align-items:baseline;gap:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;white-space:nowrap}
.brand b{color:var(--acc2)}
.brand small{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#cbd5e1;font-weight:600}
.hinfo{display:flex;align-items:center;gap:10px;font-size:13px;color:#e2e8f0;min-width:0}
.hinfo .neg{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.pill.demo{background:var(--acc2);color:#422006}
.pill.dev{background:#a5f3fc;color:#164e63}
nav#nav{background:var(--steel);position:fixed;top:58px;left:0;bottom:0;width:208px;display:flex;flex-direction:column;gap:2px;padding:12px 8px;overflow-y:auto;z-index:45}
.tab{border:0;background:none;cursor:pointer;padding:11px 14px;display:flex;flex-direction:row;align-items:center;gap:12px;font-weight:600;font-size:15px;color:#cbd5e1;border-left:4px solid transparent;border-radius:6px;text-align:left;width:100%}
.tab .ti{font-size:19px;line-height:1;width:24px;text-align:center}
.tab:hover{color:#fff;background:var(--steel2)}
.tab.act{color:#fff;background:var(--steel2);border-left-color:var(--acc)}
#hmenu{display:none;background:none;border:0;color:#fff;font-size:24px;cursor:pointer;padding:0 6px;line-height:1}
#nbk{display:none}
main#main{padding:20px;max-width:1500px;margin:0 0 0 208px}
/* panels */
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.ptit{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ptit .sp{flex:1}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.scard{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border-left:5px solid var(--steel2)}
.scard.o{border-left-color:var(--acc)}.scard.g{border-left-color:var(--ok)}.scard.r{border-left-color:var(--bad)}.scard.y{border-left-color:var(--acc2)}
.snum{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1.1}
.slbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.ssub{font-size:12px;color:var(--mut);margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* forms */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg.w2{grid-column:span 2}.fg.wf{grid-column:1/-1}
.fg label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--steel2)}
input,select,textarea{border:1.5px solid var(--line);border-radius:var(--rs);padding:8px 10px;background:#fff;outline:none;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(234,88,12,.15)}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:60px}
.hint{font-size:12px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 15px;border-radius:var(--rs);border:1.5px solid transparent;cursor:pointer;font-weight:600;background:var(--steel);color:#fff;white-space:nowrap;transition:filter .12s}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.o{background:var(--acc)}.btn.g{background:var(--ok)}.btn.r{background:var(--bad)}
.btn.l{background:#fff;color:var(--ink);border-color:var(--line)}.btn.l:hover{background:#faf9f8;filter:none}
.btn.sm{padding:4px 9px;font-size:12.5px}.btn.big{padding:12px 20px;font-size:17px}
.brow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.brow .sp{flex:1}
.srch{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:var(--rs);padding:0 10px;flex:1;min-width:200px;max-width:420px}
.srch input{border:0;box-shadow:none!important;padding:8px 0}
/* tables */
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rs)}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{background:var(--steel);color:#fff;text-align:left;padding:9px 11px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
tbody td{padding:8px 11px;border-top:1px solid #efece8;vertical-align:middle}
tbody tr:hover{background:#faf8f6}
tbody tr.click{cursor:pointer}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c{text-align:center}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-bad{background:var(--badbg);color:var(--bad)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-info{background:var(--infobg);color:var(--info)}.b-gray{background:#eceae7;color:#44403c}
.pos{color:var(--ok);font-weight:700}.neg2{color:var(--bad);font-weight:700}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--mut)}
.vacio{text-align:center;padding:34px 16px;color:var(--mut)}
.alert{padding:10px 14px;border-radius:var(--rs);margin-bottom:12px;font-size:14px}
.a-info{background:var(--infobg);color:#1e3a8a}.a-warn{background:var(--warnbg);color:#78350f}.a-bad{background:var(--badbg);color:#7f1d1d}.a-ok{background:var(--okbg);color:#14532d}
.tabs2{display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid var(--line)}
.tabs2 button{background:none;border:0;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs2 button.act{color:var(--acc);border-bottom-color:var(--acc)}
/* modal */
.moverlay{position:fixed;inset:0;background:rgba(28,25,23,.55);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.modal{position:relative;background:#fff;border-radius:var(--r);padding:22px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:980px}
.mx{position:absolute;top:10px;right:12px;width:34px;height:34px;border:0;border-radius:50%;background:#f1f0ee;color:var(--ink);font-size:22px;line-height:1;cursor:pointer;z-index:2}.mx:hover{background:var(--badbg);color:var(--bad)}.modal h2{padding-right:36px}
.modal h2{font-size:24px;margin-bottom:14px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
#toast-root{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:90vw}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--steel) 0%,#171c23 100%)}
.lbox{background:#fff;border-radius:16px;padding:30px 28px;width:100%;max-width:400px;box-shadow:0 24px 70px rgba(0,0,0,.45);border-top:6px solid var(--acc)}
.lbox h1{font-size:34px;line-height:1}.lbox h1 b{color:var(--acc)}
.lbox .sub{color:var(--mut);margin:6px 0 18px}
.lbox .fg{margin-bottom:12px}
.lbox .or{text-align:center;color:var(--mut);font-size:13px;margin:12px 0}
.lbox .btn{width:100%}
.lerr{color:var(--bad);font-weight:600;font-size:14px;margin-bottom:10px}
#loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600}
/* POS */
.pvl{display:grid;grid-template-columns:1fr 410px;gap:16px;align-items:start}
.resl{display:flex;flex-direction:column;gap:6px;max-height:62vh;overflow-y:auto}
.res{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 12px;border:1.5px solid var(--line);border-radius:var(--rs);background:#fff;cursor:pointer;text-align:left;width:100%}
.res:hover{border-color:var(--acc);background:#fff8f3}
.res .d{font-weight:600}.res .m{font-size:12px;color:var(--mut)}
.res .p{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;white-space:nowrap}
.ticket{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;position:sticky;top:78px}
.titems{max-height:36vh;overflow-y:auto;margin:10px 0}
.tit{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-bottom:1px solid #efece8;font-size:14px}
.tit .nm{font-weight:600}
.tit .ctl{display:flex;gap:6px;align-items:center;grid-column:1/-1}
.tit .ctl input{padding:4px 6px;text-align:right;width:84px}
.tit .ctl input.q{width:70px}
.tot{background:#f7f5f2;border-radius:var(--rs);padding:10px 12px;margin:10px 0}
.trow{display:flex;justify-content:space-between;font-size:14px;padding:1px 0}
.ttl{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;border-top:2px solid var(--ink);margin-top:6px;padding-top:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.seg button{flex:1;padding:8px 4px;border:1.5px solid var(--line);background:#fff;border-radius:var(--rs);font-weight:700;font-size:13px;cursor:pointer;min-width:74px}
.seg button.act{background:var(--steel);color:#fff;border-color:var(--steel)}
/* presupuesto editor */
.ddwrap{position:relative}
.dd{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1.5px solid var(--acc);border-radius:var(--rs);box-shadow:0 10px 30px rgba(0,0,0,.2);max-height:300px;overflow-y:auto}
.dd .res{border:0;border-radius:0;border-bottom:1px solid #efece8}
.ed td input,.ed td select{padding:5px 7px}
.ed td input.q{width:80px;text-align:right}.ed td input.p{width:110px;text-align:right}.ed td input.d{width:64px;text-align:right}
.ed td select{width:78px}
.dz{border:2.5px dashed #c9c3bb;border-radius:var(--r);padding:30px 16px;text-align:center;background:#fbfaf8;cursor:pointer}
.dz:hover,.dz.over{border-color:var(--acc);background:#fff8f3}
.dz b{font-size:18px}
.up{color:var(--bad);font-weight:700}.dn{color:var(--ok);font-weight:700}.eq{color:var(--mut)}
.flag{background:#fff7ed}
@media(max-width:900px){.pvl{grid-template-columns:1fr}.ticket{position:static}.g2{grid-template-columns:1fr}.fg.w2{grid-column:auto}main#main{padding:12px;margin-left:0}#hmenu{display:block}nav#nav{transform:translateX(-100%);transition:transform .2s;width:240px;box-shadow:4px 0 16px rgba(0,0,0,.25)}#app.nav-open nav#nav{transform:none}#app.nav-open #nbk{display:block;position:fixed;inset:58px 0 0 0;background:rgba(0,0,0,.35);z-index:44}.hinfo .neg,#huser{display:none}.brand{font-size:20px}header.top{padding:0 12px}}
</style>
</head>
<body>

<div id="loading">Cargando…</div>

<section id="login" class="login hidden">
  <div class="lbox">
    <h1>Mi Gestor <b>Ferretería</b></h1>
    <p class="sub">Ventas, presupuestos, cuentas corrientes y listas de precios.</p>
    <div id="lerr" class="lerr hidden"></div>
    <form id="lform" autocomplete="on">
      <div class="fg"><label for="lu">Usuario</label><input id="lu" name="username" autocomplete="username" autocapitalize="off" required></div>
      <div class="fg"><label for="lp">Contraseña</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn o big" id="lbtn" type="submit">Ingresar</button>
    </form>
    <div class="or">— o —</div>
    <button class="btn l" id="ldemo" type="button">Probar una demo sin registrarme</button>
  </div>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div style="display:flex;align-items:center;gap:6px"><button id="hmenu" type="button" aria-label="Menú">☰</button><div class="brand">Mi Gestor <b>Ferretería</b></div></div>
    <div class="hinfo">
      <span id="hflag"></span>
      <span class="neg" id="hneg"></span>
      <span id="huser"></span>
      <button class="btn l sm" id="hout" type="button">Salir</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <div id="nbk"></div>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
'use strict';
/* ===================== CONFIG ===================== */
const SB_URL = 'https://yabschiaphpiozajnwxx.supabase.co';
const SB_KEY = 'sb_publishable_BZlDsQFy_PFTx-01ZYt7rg_FN4IqLB5';
const SES_KEY = 'mgf_sesion_v1';
const S = { token: null, user: null, neg: null, mod: 'inicio', cats: [], provs: [], clientes: [], saldos: {} };
const R = {}; // render por módulo

/* ===================== UTILIDADES ===================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round(((+n || 0) + Number.EPSILON) * 100) / 100;
const fmtM = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = n => fmtM.format(+n || 0);
const fnum = (n, d) => new Intl.NumberFormat('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: d == null ? 3 : d }).format(+n || 0);
const fdate = i => i ? new Date(i).toLocaleDateString('es-AR') : '';
const fdt = i => i ? new Date(i).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }) : '';
const pad = (n, l) => String(n).padStart(l || 8, '0');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms || 280); }; };
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const lista = i => ((S.neg && S.neg.config && S.neg.config.listas_precio) || ['Mostrador', 'Mayorista', 'Constructora'])[i - 1] || ('Lista ' + i);
const CONDIVA = ['Consumidor Final', 'Monotributo', 'Responsable Inscripto', 'Exento'];

// "1.234,56" / "1,234.56" / "$ 1234" -> número
function parseNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = String(v == null ? '' : v).trim().replace(/[^\d.,\-]/g, '');
  if (!s || s === '-' || s === ',' || s === '.') return NaN;
  const c = s.lastIndexOf(','), d = s.lastIndexOf('.');
  if (c >= 0 && d >= 0) { s = c > d ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, ''); }
  else if (c >= 0) { s = /,\d{1,2}$/.test(s) && (s.match(/,/g) || []).length === 1 ? s.replace(',', '.') : s.replace(/,/g, ''); }
  else if (d >= 0) { if (/^\-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); }
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
const sanit = t => String(t || '').replace(/[,()*%\\"'`&#+=?;<>|{}\[\]^:]/g, ' ').replace(/\s+/g, ' ').trim();
function saveSes() { try { sessionStorage.setItem(SES_KEY, JSON.stringify({ token: S.token, user: S.user, neg: S.neg, t: Date.now() })); } catch (e) { } }
function loadSes() { try { const j = JSON.parse(sessionStorage.getItem(SES_KEY) || 'null'); if (j && j.token && Date.now() - j.t < 11 * 3600e3) return j; } catch (e) { } return null; }
function clearSes() { try { sessionStorage.removeItem(SES_KEY); } catch (e) { } }

function toast(msg, tipo) {
  const d = document.createElement('div');
  d.className = 'toast ' + (tipo || '');
  d.textContent = msg;
  $('#toast-root').appendChild(d);
  setTimeout(() => d.remove(), tipo === 'err' ? 6000 : 3200);
}
function modal(html, wide) {
  const o = document.createElement('div');
  o.className = 'moverlay';
  o.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '"><button type="button" class="mx" aria-label="Cerrar" title="Cerrar">×</button>' + html + '</div>';
  o.querySelector('.mx').addEventListener('click', () => o.remove());
  o.addEventListener('mousedown', e => { if (e.target === o) o.remove(); });
  $('#modal-root').appendChild(o);
  const f = o.querySelector('input:not([type=hidden]),select,textarea');
  if (f && !wide) setTimeout(() => f.focus(), 30);
  return o;
}
function closeModal() { const m = $$('.moverlay'); if (m.length) m[m.length - 1].remove(); }
function ask(texto, ok, danger) {
  return new Promise(res => {
    const o = modal('<h2>Confirmar</h2><p style="margin-bottom:6px">' + esc(texto).replace(/\n/g, '<br>') + '</p><div class="mfoot"><button class="btn l" id="ask-n">Cancelar</button><button class="btn ' + (danger ? 'r' : 'o') + '" id="ask-s">' + esc(ok || 'Aceptar') + '</button></div>');
    o.querySelector('#ask-n').onclick = () => { o.remove(); res(false); };
    o.querySelector('#ask-s').onclick = () => { o.remove(); res(true); };
  });
}
async function busy(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { toast(e.message || String(e), 'err'); } finally { if (btn) btn.disabled = false; }
}
const put = (sel, html) => { const e = $(sel); if (e) e.innerHTML = html; return !!e; };
const main = h => { $('#main').innerHTML = h; window.scrollTo(0, 0); };
const loadingHtml = '<div class="vacio">Cargando…</div>';

/* ===================== API ===================== */
async function api(path, o) {
  o = o || {};
  const m = o.method || 'GET';
  const h = { apikey: SB_KEY, Authorization: 'Bearer ' + (S.token || SB_KEY) };
  if (m === 'GET' || m === 'HEAD') h['Accept-Profile'] = 'ferreteria'; else h['Content-Profile'] = 'ferreteria';
  if (o.body !== undefined) h['Content-Type'] = 'application/json';
  const pf = [];
  if (o.prefer) pf.push(o.prefer);
  if (o.count) pf.push('count=exact');
  if (pf.length) h.Prefer = pf.join(',');
  if (o.range) { h.Range = o.range; h['Range-Unit'] = 'items'; }
  const r = await fetch(SB_URL + '/rest/v1/' + path, { method: m, headers: h, body: o.body !== undefined ? JSON.stringify(o.body) : undefined });
  const txt = await r.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
  if (!r.ok) {
    if (r.status === 401 && S.token) { toast('Tu sesión venció. Volvé a ingresar.', 'err'); setTimeout(logout, 900); }
    throw new Error((data && (data.message || data.hint || data.error)) || ('Error ' + r.status));
  }
  if (o.count) { const cr = r.headers.get('Content-Range') || ''; const t = parseInt(cr.split('/')[1], 10); return { data, total: isNaN(t) ? null : t }; }
  return data;
}
const rpc = (fn, args) => api('rpc/' + fn, { method: 'POST', body: args || {} });
const q = s => encodeURIComponent(s);

/* ===================== SESIÓN ===================== */
function showLogin(msg) {
  $('#loading').classList.add('hidden');
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  const e = $('#lerr');
  if (msg) { e.textContent = msg; e.classList.remove('hidden'); } else e.classList.add('hidden');
}
async function loginFetch(body) {
  const r = await fetch(SB_URL + '/functions/v1/login-ferreteria', { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.token) throw new Error(j.error || 'No se pudo ingresar');
  S.token = j.token; S.user = j.usuario;
  const n = await api('negocios?select=*');
  S.neg = (n && n[0]) || j.negocio || {};
  saveSes();
}
async function enterApp() {
  $('#loading').classList.add('hidden');
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#hneg').textContent = S.neg.nombre || '';
  $('#huser').textContent = S.user ? S.user.nombre : '';
  $('#hflag').innerHTML = S.neg.es_demo ? '<span class="pill demo">Demo</span>' : (S.neg.es_dev ? '<span class="pill dev">Dev</span>' : '');
  document.title = (S.neg.nombre || 'Mi Gestor Ferretería') + ' · Mi Gestor Ferretería';

function logout() { clearSes(); S.token = null; S.user = null; S.neg = null; location.href = location.pathname; }
async function demoLogin(n) {
  await loginFetch({ demo: true, n: parseInt(n, 10) || undefined });
  history.replaceState(null, '', location.pathname);
  await enterApp();
}
async function boot() {
  const p = new URLSearchParams(location.search);
  try {
    if (p.has('demo')) { await demoLogin(p.get('demo')); return; }
    const s = loadSes();
    if (s) { S.token = s.token; S.user = s.user; S.neg = s.neg; await enterApp(); return; }
  } catch (e) { clearSes(); S.token = null; showLogin(e.message); return; }
  showLogin();
}

/* Totales: precios netos (sin IVA). El IVA se suma por alícuota. */
function calcTot(items, descPct) {
  let sub = 0, iva = 0; const rates = {};
  items.forEach(i => {
    const l = r2(i.cantidad * i.precio_unit * (1 - (i.descuento_pct || 0) / 100));
    sub += l; const iv = l * (i.iva_pct || 0) / 100; iva += iv; rates[i.iva_pct] = (rates[i.iva_pct] || 0) + iv;
  });
  const d = +descPct || 0, desc = r2(sub * d / 100), k = 1 - d / 100;
  Object.keys(rates).forEach(k2 => { rates[k2] = r2(rates[k2] * k); });
  const ivaF = r2(iva * k);
  return { sub: r2(sub), desc, iva: ivaF, total: r2(sub - desc + ivaF), rates };
}
const lineaTot = i => r2(i.cantidad * i.precio_unit * (1 - (i.descuento_pct || 0) / 100));

function artFilter(term) {
  const words = sanit(term).split(' ').filter(Boolean).slice(0, 5);
  if (!words.length) return '';
  return '&and=(' + words.map(w => 'or(descripcion.ilike.*' + w + '*,codigo.ilike.*' + w + '*,marca.ilike.*' + w + '*,codigo_barras.ilike.*' + w + '*)').join(',') + ')';
}
async function artLoad() {
  if (!$('#a-list')) return;
  let p = 'articulos?select=*&activo=eq.true&order=descripcion.asc' + artFilter(A.q);
  if (A.cat) p += '&categoria_id=eq.' + A.cat;
  if (A.prov) p += '&proveedor_id=eq.' + A.prov;
  if (A.low) p += '&stock_bajo=eq.true';
  const from = A.page * A.per;
  let res;
  try { res = await api(p, { count: true, range: from + '-' + (from + A.per - 1) }); } catch (e) { put('#a-list', '<div class="alert a-bad">' + esc(e.message) + '</div>'); return; }

    : '<div class="vacio">No hay artículos con ese filtro.</div>');
}

function artCalc(src) {
  const costo = parseFloat(val('f-costo')) || 0, n = src[1];
  if (src[0] === 'p') $('#f-m' + n).value = costo > 0 ? r2((parseFloat(val('f-p' + n)) / costo - 1) * 100) : 0;
  else $('#f-p' + n).value = r2(costo * (1 + (parseFloat(val('f-m' + n)) || 0) / 100));
}
async function artSave(id) {
  const cod = val('f-cod').trim(), des = val('f-des').trim();
  if (!cod || !des) return toast('Completá código y descripción', 'err');
  const body = { codigo: cod, codigo_barras: val('f-bar').trim() || null, descripcion: des, marca: val('f-mar').trim() || null, categoria_id: val('f-cat') && val('f-cat') !== '__n' ? val('f-cat') : null, proveedor_id: val('f-prov') || null, unidad: val('f-uni'), iva_pct: +val('f-iva'), costo: parseFloat(val('f-costo')) || 0, margen_pct: parseFloat(val('f-m1')) || 0, precio1: parseFloat(val('f-p1')) || 0, precio2: parseFloat(val('f-p2')) || 0, precio3: parseFloat(val('f-p3')) || 0, stock: parseFloat(val('f-stk')) || 0, stock_min: parseFloat(val('f-min')) || 0, ubicacion: val('f-ubi').trim() || null, updated_at: new Date().toISOString() };
  await busy($('#f-save'), async () => {
    let aid = id;
    if (id) await api('articulos?id=eq.' + id, { method: 'PATCH', body });
    else { body.negocio_id = S.neg.id; const r = await api('articulos', { method: 'POST', body, prefer: 'return=representation' }); aid = r[0].id; }
    await api('articulo_proveedor?articulo_id=eq.' + aid, { method: 'DELETE' });
    const cp = val('f-cprov').trim();
    if (cp && body.proveedor_id) await api('articulo_proveedor', { method: 'POST', body: { negocio_id: S.neg.id, articulo_id: aid, proveedor_id: body.proveedor_id, codigo_proveedor: cp, descripcion_proveedor: des, costo_lista: body.costo } });
    closeModal(); toast('Artículo guardado', 'ok'); artLoad();
  });
}

async function clienteVer(id) {
  const c = cliById(id) || (await api('clientes?id=eq.' + id + '&select=*'))[0];
  const mov = await api('cuenta_corriente?cliente_id=eq.' + id + '&select=*&order=fecha.asc,created_at.asc&limit=1000');
  let saldo = 0; const rows = mov.map(m => { saldo += m.tipo === 'debe' ? +m.importe : -m.importe; return { ...m, saldo: r2(saldo) }; });
  // remitos pendientes: pagos con comprobante van al remito; el resto se aplica al más antiguo
  const ventasCC = await api('ventas?cliente_id=eq.' + id + '&condicion=eq.cuenta_corriente&select=id,numero,fecha,total&order=fecha.asc');
  const pend = ventasCC.map(v => { const dv = mov.filter(x => x.tipo === 'debe' && x.comprobante_id === v.id).reduce((s, x) => s + +x.importe, 0) || +v.total; const pg = mov.filter(x => x.tipo === 'haber' && x.comprobante_id === v.id).reduce((s, x) => s + +x.importe, 0); return { ...v, debe: r2(dv), resta: r2(dv - pg) }; });
  let libre = mov.filter(x => x.tipo === 'haber' && !x.comprobante_id).reduce((s, x) => s + +x.importe, 0);
  pend.forEach(v => { if (v.resta > 0 && libre > 0) { const ap = Math.min(v.resta, libre); v.resta = r2(v.resta - ap); libre = r2(libre - ap); } });
  const abiertos = pend.filter(v => v.resta > 0.009);
  const o = modal('<h2>' + esc(c.nombre) + '</h2><div class="hint" style="margin-bottom:10px">' + esc([c.cuit, c.condicion_iva, c.telefono, c.email, c.direccion].filter(Boolean).join(' · ')) + '</div>' +
    '<div class="sgrid"><div class="scard ' + (saldo > 0.009 ? 'r' : 'g') + '"><div class="slbl">Saldo actual</div><div class="snum">' + money(saldo) + '</div><div class="ssub">' + (saldo > 0.009 ? 'El cliente debe' : saldo < -0.009 ? 'Saldo a favor del cliente' : 'Al día') + '</div></div><div class="scard"><div class="slbl">Límite de crédito</div><div class="snum">' + (c.limite_credito > 0 ? money(c.limite_credito) : 'Sin límite') + '</div><div class="ssub">Lista: ' + esc(lista(c.lista_precio)) + (c.descuento_pct ? ' · Desc. ' + fnum(c.descuento_pct, 2) + '%' : '') + '</div></div></div>' +
    '<div class="brow"><button class="btn g" onclick="cliPago(\'' + id + '\')">💵 Registrar pago</button><button class="btn" onclick="closeModal();go(\'presupuestos\',{nuevo:true,cliente:\'' + id + '\'})">📋 Nuevo presupuesto</button><button class="btn l" onclick="cliEstado(\'' + id + '\')">🖨️ Estado de cuenta</button><button class="btn l" onclick="closeModal();cliEdit(\'' + id + '\')">✏️ Editar</button></div>' +
    (abiertos.length ? '<div class="panel" style="padding:12px;margin-bottom:12px;border:1.5px solid var(--acc2)"><div class="ptit" style="font-size:18px">🧾 Remitos pendientes de cobro</div><div class="twrap"><table><thead><tr><th>Remito</th><th>Fecha</th><th class="n">Total</th><th class="n">Falta cobrar</th><th></th></tr></thead><tbody>' + abiertos.map(v => '<tr><td><b>N° ' + pad(v.numero, 8) + '</b></td><td>' + fdate(v.fecha) + '</td><td class="n">' + money(v.debe) + '</td><td class="n"><b>' + money(v.resta) + '</b></td><td><button class="btn g sm" onclick="cobrarRemito(\'' + v.id + '\',' + v.resta + ',' + v.numero + ',\'' + id + '\')">💵 Cobrar</button></td></tr>').join('') + '</tbody></table></div></div>' : '') +
    (rows.length ? '<div class="twrap" style="max-height:46vh;overflow-y:auto"><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="n">Debe</th><th class="n">Haber</th><th class="n">Saldo</th></tr></thead><tbody>' + rows.slice().reverse().map(m => '<tr><td>' + fdate(m.fecha) + '</td><td>' + esc(m.concepto || '') + (m.medio_pago ? ' <span class="hint">(' + esc(m.medio_pago) + ')</span>' : '') + '</td><td class="n">' + (m.tipo === 'debe' ? money(m.importe) : '') + '</td><td class="n pos">' + (m.tipo === 'haber' ? money(m.importe) : '') + '</td><td class="n"><b>' + money(m.saldo) + '</b></td></tr>').join('') + '</tbody></table></div>' : '<div class="vacio">Este cliente todavía no tiene movimientos.</div>') +
    '<div class="mfoot"><button class="btn l" onclick="closeModal()">Cerrar</button></div>', true);
  o._rows = rows; o._c = c; window._ccView = { c, rows, saldo };
}

function cobrarRemito(ventaId, resta, numero, cliId) {
  modal('<h2>Cobrar remito N° ' + pad(numero, 8) + '</h2><div class="fgrid"><div class="fg"><label>Importe cobrado</label><input id="cr-imp" type="number" step="0.01" min="0.01" max="' + resta + '" value="' + resta + '"></div><div class="fg"><label>Forma de pago</label><select id="cr-med"><option>efectivo</option><option>transferencia</option><option>débito</option><option>crédito</option><option>cheque</option></select></div></div><div class="hint">Falta cobrar ' + money(resta) + '. Podés cobrar una parte; el resto queda pendiente. Se registra en la caja y baja la deuda del cliente.</div><div class="mfoot"><button class="btn l" onclick="closeModal()">Cancelar</button><button class="btn g" id="cr-ok">Registrar cobro</button></div>');
  $('#cr-ok').onclick = () => busy($('#cr-ok'), async () => {
    const imp = parseFloat(val('cr-imp')); if (!(imp > 0) || imp > resta + 0.005) return toast('Importe inválido (máximo ' + money(resta) + ')', 'err');
    await rpc('cobrar_remito', { p_venta: ventaId, p_importe: imp, p_medio: val('cr-med') });
    await loadClientes(); closeModal(); closeModal(); toast('Cobro registrado', 'ok'); if (S.mod === 'clientes') cliList(); clienteVer(cliId);
  });
}
/* ===================== BÚSQUEDA DE ARTÍCULOS (compartida) ===================== */
async function buscarArt(term, limit) {
  const t = sanit(term); if (!t) return [];
  let exact = [];
  if (/^[\w\-./]+$/.test(t)) exact = await api('articulos?select=*&activo=eq.true&or=(codigo.ilike.' + q(t) + ',codigo_barras.eq.' + q(t) + ')&limit=5');
  if (exact.length === 1) return exact;
  const r = await api('articulos?select=*&activo=eq.true&order=descripcion.asc&limit=' + (limit || 15) + artFilter(t));
  return exact.length ? exact.concat(r.filter(x => !exact.some(y => y.id === x.id))) : r;
}
const r3 = n => Math.round((+n || 0) * 1000) / 1000;
const itemFromArt = (a, lis) => ({ articulo_id: a.id, codigo: a.codigo, descripcion: a.descripcion, unidad: a.unidad, cantidad: 1, precio_unit: +a['precio' + lis] || 0, descuento_pct: 0, iva_pct: +a.iva_pct, stock: +a.stock, precios: [+a.precio1, +a.precio2, +a.precio3] });
const resHtml = (a, lis, fn) => '<button type="button" class="res" onclick="' + fn + '(\'' + a.id + '\')"><div><div class="d">' + esc(a.descripcion) + '</div><div class="m">' + esc(a.codigo) + (a.marca ? ' · ' + esc(a.marca) : '') + ' · stock ' + fnum(a.stock) + ' ' + esc(a.unidad) + (a.stock_bajo ? ' ⚠' : '') + '</div></div><div class="p">' + money(a['precio' + lis]) + '</div></button>';
const artCache = {};

/* ===================== VENTAS (MOSTRADOR) ===================== */
const V = { items: [], cliente: '', lista: 1, desc: 0, cond: 'contado', medio: 'efectivo', res: [] };
R.ventas = async () => {
  if (!V.cliente) { const cf = S.clientes.find(c => c.nombre === 'Consumidor Final'); V.cliente = cf ? cf.id : ''; }
  main('<div class="pvl"><div class="panel"><div class="ptit">🧾 Venta de mostrador</div><div class="srch" style="max-width:none;margin-bottom:10px">🔎<input id="v-q" autocomplete="off" placeholder="Escaneá el código de barras o escribí para buscar y presioná Enter" autofocus></div><div id="v-res" class="resl"><div class="vacio">Buscá un artículo para agregarlo al ticket.</div></div></div><div class="ticket" id="tk"></div></div>');
  api('caja_turnos?select=id&cerrada_at=is.null&limit=1').then(r => { if (!r.length && S.mod === 'ventas') { const e = $('.pvl .panel .ptit'); if (e) e.insertAdjacentHTML('afterend', '<div class="alert a-warn" style="margin-bottom:10px">⚠️ La caja está cerrada: las ventas se registran igual, pero no entran en ningún turno. <a href="#" onclick="go(\'caja\');return false"><b>Abrir caja</b></a></div>'); } }).catch(() => { });
  const inp = $('#v-q');
  inp.addEventListener('input', debounce(async () => { const t = inp.value; if (t.trim().length < 2) { put('#v-res', '<div class="vacio">Buscá un artículo para agregarlo al ticket.</div>'); return; } try { const rr = await buscarArt(t, 20); if (inp.value !== t) return; V.res = rr; posRes(); } catch (e) { put('#v-res', '<div class="alert a-bad">' + esc(e.message) + '</div>'); } }, 250));
  inp.addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return; e.preventDefault();
    const t = inp.value.trim(); if (!t) return;
    try { const r = await buscarArt(t, 20); V.res = r; if (r.length) { posAdd(r[0].id); inp.value = ''; put('#v-res', ''); } else { posRes(); } } catch (er) { toast(er.message, 'err'); }
  });
  posTicket(); inp.focus();
};
function posRes() {
  V.res.forEach(a => { artCache[a.id] = a; });
  put('#v-res', V.res.length ? V.res.map(a => resHtml(a, V.lista, 'posAdd')).join('') : '<div class="vacio">No se encontró ningún artículo.</div>');
}
function posAdd(id) {
  const a = artCache[id] || V.res.find(x => x.id === id); if (!a) return;
  const ex = V.items.find(i => i.articulo_id === id);
  if (ex) ex.cantidad = r3(ex.cantidad + 1); else V.items.push(itemFromArt(a, V.lista));
  if (+a.stock <= 0) toast('⚠ ' + a.descripcion + ' no tiene stock cargado', '');
  posTicket(); const i = $('#v-q'); if (i) i.focus();
}
function posCli(id) {
  V.cliente = id; const c = cliById(id);
  if (c) { V.lista = c.lista_precio || 1; V.desc = +c.descuento_pct || 0; V.items.forEach(i => { if (i.precios) i.precio_unit = i.precios[V.lista - 1]; }); if (c.nombre === 'Consumidor Final') V.cond = 'contado'; }

}

function waNumero(t) {
  let d = String(t || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('54')) return d;
  d = d.replace(/^0+/, '');
  if (d.length === 12) { for (const a of [2, 3, 4]) { if (d.slice(a, a + 2) === '15') { d = d.slice(0, a) + d.slice(a + 2); break; } } }
  if (d.length === 10) return '549' + d;
  return '54' + d;
}

}

      '<div class="fgrid" style="max-width:520px"><div class="fg"><label>Monto inicial en efectivo</label><input id="ca-ini" type="number" step="0.01" min="0" value="0"></div><div class="fg"><label>Responsable</label><input value="' + esc(S.user.nombre) + '" disabled></div></div><button class="btn o big" id="ca-abrir" onclick="cajaAbrir()">🔓 Abrir turno</button></div>';

    const d = await cajaDatos(t), k = d.calc, cli = id => { const c = cliById(id); return c ? c.nombre : 'Consumidor Final'; };

      '<div class="hint" style="margin-bottom:12px">Turno abierto el ' + fdt(t.abierta_at) + ' por ' + esc(t.usuario_nombre || '') + ' · Monto inicial: <b>' + money(t.monto_inicial) + '</b></div>' +
      '<div class="sgrid"><div class="scard o"><div class="slbl">Efectivo esperado en caja</div><div class="snum">' + money(k.esperado) + '</div><div class="ssub">Inicial + cobros − egresos en efectivo</div></div><div class="scard g"><div class="slbl">Ventas del turno</div><div class="snum">' + money(k.ventas_total) + '</div><div class="ssub">' + k.ventas_cant + ' venta(s)' + (k.cc_cant ? ' · ' + money(k.cc_total) + ' en cuenta corriente' : '') + '</div></div><div class="scard g"><div class="slbl">Ingresos</div><div class="snum">' + money(k.ing) + '</div></div><div class="scard r"><div class="slbl">Egresos</div><div class="snum">' + money(k.egr) + '</div></div></div>' +
      '<div class="ptit" style="font-size:18px">Por medio de pago</div>' + (medios.length ? '<div class="twrap"><table><thead><tr><th>Medio</th><th class="n">Ingresos</th><th class="n">Egresos</th><th class="n">Neto</th></tr></thead><tbody>' + medios.map(m => { const o = k.porMedio[m]; return '<tr><td>' + esc(m) + '</td><td class="n pos">' + money(o.ing) + '</td><td class="n neg2">' + (o.egr ? '−' + money(o.egr) : '') + '</td><td class="n"><b>' + money(o.ing - o.egr) + '</b></td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="vacio">Todavía no hay cobros en este turno.</div>') + '</div>' +

  main(h);

async function cajaAbrir() {
  const ini = parseFloat(val('ca-ini')); if (isNaN(ini) || ini < 0) return toast('Ingresá un monto inicial válido (puede ser 0)', 'err');
  await busy($('#ca-abrir'), async () => { await api('caja_turnos', { method: 'POST', body: { negocio_id: S.neg.id, usuario_id: S.user.id, usuario_nombre: S.user.nombre, monto_inicial: ini } }); toast('Turno abierto', 'ok'); cajaRender(); });
}
function cajaMov(tipo) {
  if (!CJ.turno) return toast('Abrí el turno de caja primero', 'err');
  modal('<h2>' + (tipo === 'ingreso' ? 'Nuevo ingreso' : 'Nuevo egreso') + '</h2><div class="fgrid"><div class="fg wf"><label>Concepto *</label><input id="cm-con" placeholder="' + (tipo === 'ingreso' ? 'Ej.: Aporte de caja chica' : 'Ej.: Pago de flete, retiro de efectivo') + '"></div><div class="fg"><label>Importe *</label><input id="cm-imp" type="number" step="0.01" min="0.01"></div><div class="fg"><label>Medio</label><select id="cm-med"><option>efectivo</option><option>transferencia</option><option>débito</option><option>crédito</option><option>cheque</option></select></div></div><div class="mfoot"><button class="btn l" onclick="closeModal()">Cancelar</button><button class="btn ' + (tipo === 'ingreso' ? 'g' : 'r') + '" id="cm-ok" onclick="cajaMovOk(\'' + tipo + '\')">Registrar</button></div>');
}
async function cajaMovOk(tipo) {
  const c = val('cm-con').trim(), i = parseFloat(val('cm-imp')); if (!c || !(i > 0)) return toast('Completá concepto e importe', 'err');
  await busy($('#cm-ok'), async () => { await api('caja_movimientos', { method: 'POST', body: { negocio_id: S.neg.id, tipo, concepto: c, importe: i, medio_pago: val('cm-med'), usuario_id: S.user.id } }); closeModal(); toast('Movimiento registrado', 'ok'); cajaRender(); });
}
async function cajaCerrar() {
  const t = CJ.turno; if (!t) return;
  const d = await cajaDatos(t), k = d.calc;
  modal('<h2>🔒 Cerrar caja</h2><div class="alert a-info">Contá el efectivo que hay en el cajón e ingresalo. Se compara con lo que el sistema espera.</div><div class="sgrid"><div class="scard"><div class="slbl">Monto inicial</div><div class="snum" style="font-size:24px">' + money(t.monto_inicial) + '</div></div><div class="scard o"><div class="slbl">Efectivo esperado</div><div class="snum" style="font-size:24px">' + money(k.esperado) + '</div></div><div class="scard"><div class="slbl">Ventas del turno</div><div class="snum" style="font-size:24px">' + money(k.ventas_total) + '</div></div></div>' +
    '<div class="fgrid"><div class="fg"><label>Efectivo contado *</label><input id="cc-cont" type="number" step="0.01" min="0" oninput="cajaDif(' + k.esperado + ')"></div><div class="fg"><label>Diferencia</label><input id="cc-dif" disabled value="—"></div><div class="fg wf"><label>Observaciones</label><textarea id="cc-not" rows="2" placeholder="Opcional: explicá cualquier diferencia"></textarea></div></div><div class="mfoot"><button class="btn l" onclick="closeModal()">Cancelar</button><button class="btn o" id="cc-ok">Cerrar caja</button></div>');
  $('#cc-ok').onclick = () => busy($('#cc-ok'), async () => {
    const cont = parseFloat(val('cc-cont')); if (isNaN(cont) || cont < 0) return toast('Ingresá el efectivo contado', 'err');
    const dif = r2(cont - k.esperado), ahora = new Date().toISOString();
    const dd = await cajaDatos(t), k2 = dd.calc; // recalcula por si hubo movimientos mientras tanto
    const dif2 = r2(cont - k2.esperado);
    await api('caja_turnos?id=eq.' + t.id, { method: 'PATCH', body: { cerrada_at: ahora, cerrada_por: S.user.nombre, efectivo_esperado: k2.esperado, efectivo_contado: cont, diferencia: dif2, notas: val('cc-not').trim() || null, resumen: { porMedio: k2.porMedio, ing: k2.ing, egr: k2.egr, ventas_total: k2.ventas_total, ventas_cant: k2.ventas_cant, cc_total: k2.cc_total, cc_cant: k2.cc_cant } } });
    closeModal(); toast('Caja cerrada' + (Math.abs(dif2) < 0.01 ? ' sin diferencias' : ' con diferencia de ' + money(dif2)), Math.abs(dif2) < 0.01 ? 'ok' : 'err');
    await cajaRender(); cajaVerTurno(t.id);
  });
}
function cajaDif(esp) { const v = parseFloat(val('cc-cont')); const e = $('#cc-dif'); if (!e) return; if (isNaN(v)) { e.value = '—'; return; } const d = r2(v - esp); e.value = Math.abs(d) < 0.01 ? 'Sin diferencia' : (d > 0 ? 'Sobran ' : 'Faltan ') + money(Math.abs(d)); e.style.color = Math.abs(d) < 0.01 ? 'var(--ok)' : 'var(--bad)'; }
async function cajaVerTurno(id) {
  const t = (await api('caja_turnos?id=eq.' + id + '&select=*'))[0]; if (!t) return;

    '<div class="twrap"><table><thead><tr><th>Medio</th><th class="n">Ingresos</th><th class="n">Egresos</th></tr></thead><tbody>' + Object.keys(k.porMedio).map(m => '<tr><td>' + esc(m) + '</td><td class="n">' + money(k.porMedio[m].ing) + '</td><td class="n">' + money(k.porMedio[m].egr) + '</td></tr>').join('') + '</tbody></table></div><div class="mfoot"><button class="btn l" onclick="closeModal()">Cerrar</button><button class="btn" onclick="cajaImprimir()">🖨️ Imprimir arqueo</button></div>', true);

async function usrEditar(id) {
  const u = (await api('usuarios?select=id,nombre,username,rol,activo&id=eq.' + id))[0]; if (!u) return;
  modal('<h2>Editar ' + esc(u.username) + '</h2><div class="fgrid"><div class="fg"><label>Nombre</label><input id="ue-nom" value="' + esc(u.nombre) + '"></div><div class="fg"><label>Rol</label><select id="ue-rol">' + ROLOPT(u.rol) + '</select></div><div class="fg"><label>Estado</label><select id="ue-act"><option value="1"' + (u.activo ? ' selected' : '') + '>Activo</option><option value="0"' + (u.activo ? '' : ' selected') + '>Inactivo (no puede entrar)</option></select></div></div><div class="mfoot"><button class="btn l" onclick="closeModal()">Cancelar</button><button class="btn o" id="ue-ok">Guardar</button></div>');
  $('#ue-ok').onclick = () => busy($('#ue-ok'), async () => {
    await usrFn({ accion: 'editar', id, nombre: val('ue-nom'), rol: val('ue-rol'), activo: val('ue-act') === '1' });
    closeModal(); toast('Usuario actualizado', 'ok'); go('config');
  }).catch(e => toast(e.message, 'err'));
}
async function usrClave(id) {
  const u = (await api('usuarios?select=id,username&id=eq.' + id))[0]; if (!u) return;
  modal('<h2>Nueva contraseña para ' + esc(u.username) + '</h2><div class="fgrid"><div class="fg wf"><label>Contraseña nueva (mín. 8)</label><input id="uc-pw" type="password" autocomplete="new-password"></div></div><div class="mfoot"><button class="btn l" onclick="closeModal()">Cancelar</button><button class="btn o" id="uc-ok">Cambiar contraseña</button></div>');
  $('#uc-ok').onclick = () => busy($('#uc-ok'), async () => {
    await usrFn({ accion: 'clave', id, password: val('uc-pw') });
    closeModal(); toast('Contraseña cambiada', 'ok');
  }).catch(e => toast(e.message, 'err'));
}
function usrMiClave() {
  modal('<h2>Cambiar mi contraseña</h2><div class="fgrid"><div class="fg wf"><label>Contraseña actual</label><input id="um-a" type="password" autocomplete="current-password"></div><div class="fg wf"><label>Contraseña nueva (mín. 8)</label><input id="um-n" type="password" autocomplete="new-password"></div></div><div class="mfoot"><button class="btn l" onclick="closeModal()">Cancelar</button><button class="btn o" id="um-ok">Cambiar</button></div>');
  $('#um-ok').onclick = () => busy($('#um-ok'), async () => {
    await usrFn({ accion: 'mi_clave', actual: val('um-a'), nueva: val('um-n') });
    closeModal(); toast('Contraseña actualizada', 'ok');
  }).catch(e => toast(e.message, 'err'));
}
</script>
